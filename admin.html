<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Admin — Hippo Prep</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:#1B2A4A;min-height:100vh;padding:24px;color:#FAF6EE;}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;}
h1{font-size:22px;font-weight:700;}
.card{background:#fff;border-radius:14px;padding:28px;margin-bottom:16px;color:#1B2A4A;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;}
.stat{background:rgba(255,255,255,0.1);border-radius:10px;padding:16px;text-align:center;}
.stat-num{font-size:28px;font-weight:700;}
.stat-label{font-size:12px;opacity:.7;margin-top:4px;}
.user-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid #f0e9d8;}
.user-row:last-child{border-bottom:none;}
.email{font-weight:600;font-size:14px;}
.date{font-size:12px;color:#6B7280;margin-top:2px;}
.badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;}
.locked{background:#fee2e2;color:#E0533D;}
.unlocked{background:#dcfce7;color:#16a34a;}
.unlock-btn{background:#16a34a;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;margin-left:8px;}
.lock-btn{background:#6B7280;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;margin-left:8px;}
.refresh-btn{background:rgba(255,255,255,0.15);color:#FAF6EE;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;}
.empty{text-align:center;color:#6B7280;padding:32px;font-size:14px;}
.admin-login{background:#fff;border-radius:16px;padding:40px;max-width:360px;margin:80px auto;color:#1B2A4A;}
.admin-login h2{font-size:20px;font-weight:700;margin-bottom:20px;}
input{width:100%;padding:12px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:14px;margin-bottom:12px;font-family:inherit;outline:none;}
input:focus{border-color:#1a6b3c;}
.btn{width:100%;padding:13px;background:#1a6b3c;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,0.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="login-screen">
  <div class="admin-login">
    <h2>🔐 Admin Panel</h2>
    <input type="password" id="admin-pass" placeholder="Admin нууц үг" onkeydown="if(event.key==='Enter')adminLogin()"/>
    <button class="btn" onclick="adminLogin()">Нэвтрэх</button>
    <div id="login-err" style="color:#dc2626;font-size:13px;margin-top:10px;display:none;"></div>
  </div>
</div>

<div id="panel" style="display:none">
  <div class="header">
    <div>
      <h1>👑 Hippo Prep Admin</h1>
      <div style="font-size:13px;opacity:.7;margin-top:4px;">Бүх хэрэглэгчид Supabase database-д хадгалагдаж байна</div>
    </div>
    <button class="refresh-btn" onclick="loadUsers()">🔄 Шинэчлэх</button>
  </div>
  <div class="stats" id="stats"></div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <h2 style="font-size:16px;font-weight:700;">Бүртгэлтэй хэрэглэгчид</h2>
      <span id="last-updated" style="font-size:12px;color:#6B7280;"></span>
    </div>
    <div id="user-list"><div class="empty">⏳ Ачааллаж байна...</div></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://hmcbhdhiytatawfickjp.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhtY2JoZGhpeXRhdGF3Zmlja2pwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzNjIxMTcsImV4cCI6MjEwMTkzODExN30.-h7iWbbgCqegtKV_fdDZjATUvJzSfZUmVaRcpqapWD4';
const ADMIN_PASSWORD = 'hippo2025admin';

async function sbFetch(path, method='GET', body=null) {
  const opts = {
    method,
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': method==='PATCH' ? 'return=representation' : ''
    }
  };
  if (body) opts.body = JSON.stringify(body);
  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, opts);
    return res.ok ? res.json() : null;
  } catch(e) { return null; }
}

function adminLogin() {
  const pass = document.getElementById('admin-pass').value;
  if (pass === ADMIN_PASSWORD) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('panel').style.display = 'block';
    loadUsers();
  } else {
    const err = document.getElementById('login-err');
    err.textContent = 'Нууц үг буруу!';
    err.style.display = 'block';
  }
}

async function loadUsers() {
  document.getElementById('user-list').innerHTML = '<div class="empty"><div class="spinner"></div></div>';
  const users = await sbFetch('users?select=*&order=registered_at.desc');
  if (!users) { document.getElementById('user-list').innerHTML = '<div class="empty">Алдаа гарлаа. Дахин оролдоно уу.</div>'; return; }
  
  const total = users.length;
  const unlocked = users.filter(u=>u.unlocked).length;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="stat-num">${total}</div><div class="stat-label">Нийт хэрэглэгч</div></div>
    <div class="stat"><div class="stat-num" style="color:#7A9B76">${unlocked}</div><div class="stat-label">Эрх нээлттэй</div></div>
    <div class="stat"><div class="stat-num" style="color:#E0533D">${total-unlocked}</div><div class="stat-label">Хүлээж байгаа</div></div>
  `;
  document.getElementById('last-updated').textContent = 'Сүүлд шинэчлэгдсэн: ' + new Date().toLocaleTimeString('mn-MN');

  if (users.length === 0) { document.getElementById('user-list').innerHTML = '<div class="empty">Бүртгэлтэй хэрэглэгч байхгүй байна</div>'; return; }

  document.getElementById('user-list').innerHTML = users.map(u => `
    <div class="user-row" id="row-${btoa(u.email).replace(/[^a-zA-Z0-9]/g,'')}">
      <div>
        <div class="email">📧 ${u.email}</div>
        <div class="date">Бүртгэсэн: ${u.registered_at ? new Date(u.registered_at).toLocaleString('mn-MN') : '—'}</div>
      </div>
      <div style="display:flex;align-items:center;">
        <span class="badge ${u.unlocked?'unlocked':'locked'}">${u.unlocked?'✅ Нээлттэй':'🔒 Хүлээж байна'}</span>
        ${!u.unlocked
          ? `<button class="unlock-btn" onclick="unlockUser('${u.email}')">Нээх</button>`
          : `<button class="lock-btn" onclick="lockUser('${u.email}')">Хаах</button>`
        }
      </div>
    </div>
  `).join('');
}

async function unlockUser(email) {
  const res = await sbFetch('users?email=eq.' + encodeURIComponent(email), 'PATCH', { unlocked: true, unlocked_at: new Date().toISOString() });
  if (res) { loadUsers(); } else { alert('Алдаа гарлаа!'); }
}

async function lockUser(email) {
  if (!confirm(email + ' хэрэглэгчийн эрхийг хаах уу?')) return;
  const res = await sbFetch('users?email=eq.' + encodeURIComponent(email), 'PATCH', { unlocked: false });
  if (res) { loadUsers(); } else { alert('Алдаа гарлаа!'); }
}
</script>
</body>
</html>
