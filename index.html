<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hippo Prep — Olympiad Study Shelf</title>
  <style>
/* ============================================================
   HIPPO PREP — Design tokens
   Palette: ink navy (#1B2A4A), parchment (#FAF6EE), coral (#E0533D),
            sage (#7A9B76), slate (#6B7280)
   Type: Fraunces (display, academic-competition serif) / Inter (body) / JetBrains Mono (numerics)
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');

:root {
  --ink: #1B2A4A;
  --ink-soft: #2E4068;
  --parchment: #FAF6EE;
  --parchment-deep: #F0E9D8;
  --coral: #E0533D;
  --coral-deep: #C43E2C;
  --sage: #7A9B76;
  --sage-deep: #5C7D58;
  --slate: #6B7280;
  --white: #FFFFFF;
  --line: rgba(27, 42, 74, 0.12);

  --font-display: 'Fraunces', serif;
  --font-body: 'Inter', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--parchment);
  color: var(--ink);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
}

body {
  min-height: 100vh;
}

a { color: inherit; }

button {
  font-family: var(--font-body);
  cursor: pointer;
}

.visually-hidden {
  position: absolute;
  left: -9999px;
}

/* focus visibility */
button:focus-visible,
input:focus-visible,
a:focus-visible {
  outline: 3px solid var(--coral);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

/* ============================================================
   LAYOUT SHELL
   ============================================================ */

.app {
  max-width: 1080px;
  margin: 0 auto;
  padding: 0 24px 80px;
}

.topbar {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding: 36px 0 28px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 44px;
}

.brand {
  display: flex;
  align-items: baseline;
  gap: 12px;
}

.brand-mark {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: 28px;
  letter-spacing: -0.01em;
  color: var(--ink);
}

.brand-tag {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--coral);
}

.back-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: none;
  border: none;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 14px;
  color: var(--ink);
  padding: 8px 4px;
}
.back-link:hover { color: var(--coral); }

/* ============================================================
   HOME — Bookshelf
   ============================================================ */

.hero {
  margin-bottom: 56px;
}

.hero-eyebrow {
  font-family: var(--font-mono);
  font-size: 13px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--coral);
  margin: 0 0 14px;
}

.hero h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(34px, 5vw, 52px);
  line-height: 1.08;
  margin: 0 0 18px;
  letter-spacing: -0.01em;
}

.hero h1 em {
  font-style: italic;
  color: var(--coral);
}

.hero p {
  font-size: 17px;
  line-height: 1.6;
  color: var(--ink-soft);
  max-width: 560px;
  margin: 0;
}

.shelf {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
}

@media (max-width: 800px) {
  .shelf { grid-template-columns: 1fr; }
}

.book {
  position: relative;
  border: none;
  border-radius: 4px;
  background: var(--ink);
  color: var(--parchment);
  padding: 0;
  text-align: left;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-height: 320px;
  box-shadow: 0 1px 0 rgba(0,0,0,0.05);
  transition: transform 0.22s cubic-bezier(.2,.8,.2,1), box-shadow 0.22s ease;
}

.book:hover, .book:focus-visible {
  transform: translateY(-6px);
  box-shadow: 0 18px 30px -10px rgba(27,42,74,0.35);
}

.book-spine {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 10px;
}

.book[data-tone="coral"] .book-spine { background: var(--coral); }
.book[data-tone="sage"] .book-spine { background: var(--sage); }
.book[data-tone="ink-soft"] .book-spine { background: #8A9BC4; }

.book-body {
  padding: 36px 28px 28px 38px;
  flex: 1;
  display: flex;
  flex-direction: column;
}

.book-kicker {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  opacity: 0.65;
  margin-bottom: 18px;
}

.book-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 27px;
  line-height: 1.15;
  margin: 0 0 12px;
}

.book-desc {
  font-size: 14.5px;
  line-height: 1.55;
  opacity: 0.82;
  margin: 0 0 auto;
  padding-bottom: 24px;
}

.book-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 18px;
  border-top: 1px solid rgba(250,246,238,0.18);
  font-size: 13px;
}

.book-meta-stat {
  font-family: var(--font-mono);
  opacity: 0.8;
}

.book-cta {
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.book[data-tone="coral"] .book-cta { color: #FFD9CF; }
.book[data-tone="sage"] .book-cta { color: #D7E8D3; }
.book[data-tone="ink-soft"] .book-cta { color: #D9E1F5; }

.book-cta svg { transition: transform 0.2s ease; }
.book:hover .book-cta svg { transform: translateX(4px); }

.footnote {
  margin-top: 56px;
  font-size: 13px;
  color: var(--slate);
  line-height: 1.6;
  border-top: 1px solid var(--line);
  padding-top: 24px;
}

/* Level tabs for crossword picker */
.level-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 8px;
}

.level-tab {
  font-family: var(--font-mono);
  font-size: 12.5px;
  letter-spacing: 0.03em;
  background: var(--white);
  border: 1.5px solid var(--line);
  border-radius: 20px;
  padding: 9px 16px;
  color: var(--ink-soft);
  font-weight: 600;
  transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
}

.level-tab:hover {
  border-color: var(--ink-soft);
}

.level-tab.active {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--parchment);
}

.level-tab-count {
  opacity: 0.65;
  margin-left: 4px;
}

/* ============================================================
   CROSSWORD PAGE
   ============================================================ */

.page-head {
  margin-bottom: 32px;
}

.page-eyebrow {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--coral);
  margin: 0 0 10px;
}

.page-head h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(28px, 4vw, 38px);
  margin: 0 0 8px;
  letter-spacing: -0.01em;
}

.page-head p {
  color: var(--slate);
  font-size: 15px;
  margin: 0;
  max-width: 600px;
  line-height: 1.5;
}

.xword-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 320px;
  gap: 40px;
  align-items: start;
}

@media (max-width: 880px) {
  .xword-layout { grid-template-columns: 1fr; }
}

.xword-board-wrap {
  background: var(--white);
  border-radius: 10px;
  padding: 20px;
  border: 1px solid var(--line);
  overflow-x: auto;
}

.xword-grid {
  display: grid;
  gap: 2px;
  width: max-content;
  margin: 0 auto;
}

.cell {
  position: relative;
  width: 34px;
  height: 34px;
  background: var(--ink);
}

.cell.empty {
  background: transparent;
}

.cell.active {
  background: var(--white);
  border: 1.5px solid var(--line);
}

.cell.active.filled-correct input {
  color: var(--sage-deep);
}

.cell-number {
  position: absolute;
  top: 1px;
  left: 3px;
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--slate);
  pointer-events: none;
  line-height: 1;
}

.cell input {
  width: 100%;
  height: 100%;
  border: none;
  background: transparent;
  text-align: center;
  text-transform: uppercase;
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 16px;
  color: var(--ink);
  padding: 0;
  border-radius: 2px;
}

.cell input:focus {
  outline: none;
  background: rgba(224, 83, 61, 0.12);
}

.cell.highlight input {
  background: rgba(224, 83, 61, 0.06);
}

@media (max-width: 480px) {
  .cell { width: 26px; height: 26px; }
  .cell input { font-size: 13px; }
}

.xword-side {
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.clue-panel {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 22px 22px 8px;
}

.clue-panel h2 {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--coral);
  margin: 0 0 14px;
}

.clue-list {
  list-style: none;
  margin: 0;
  padding: 0 0 14px;
}

.clue-list li {
  display: flex;
  gap: 10px;
  font-size: 14px;
  line-height: 1.5;
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
}
.clue-list li:last-child { border-bottom: none; }
.clue-list li:hover { color: var(--coral-deep); }
.clue-list li.solved { color: var(--sage-deep); text-decoration: line-through; opacity: 0.7; }

.clue-num {
  font-family: var(--font-mono);
  font-weight: 700;
  color: var(--ink);
  min-width: 20px;
  flex-shrink: 0;
}

.clue-list li.solved .clue-num { color: var(--sage-deep); }

.xword-controls {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.btn {
  font-weight: 600;
  font-size: 14.5px;
  border-radius: 8px;
  padding: 13px 20px;
  border: none;
  text-align: center;
  transition: transform 0.15s ease, background 0.15s ease;
}
.btn:hover { transform: translateY(-1px); }

.btn-primary {
  background: var(--coral);
  color: var(--white);
}
.btn-primary:hover { background: var(--coral-deep); }

.btn-secondary {
  background: var(--white);
  color: var(--ink);
  border: 1.5px solid var(--line);
}
.btn-secondary:hover { border-color: var(--ink); }

.xword-progress {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 18px 22px;
}

.xword-progress-label {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--slate);
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
}

.progress-track {
  height: 8px;
  background: var(--parchment-deep);
  border-radius: 4px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--sage);
  border-radius: 4px;
  transition: width 0.3s ease;
}

.xword-result-banner {
  background: var(--sage);
  color: var(--white);
  border-radius: 10px;
  padding: 18px 22px;
  font-weight: 600;
  font-family: var(--font-display);
  font-size: 17px;
  display: none;
}
.xword-result-banner.show { display: block; }

/* ============================================================
   TEST PAGES
   ============================================================ */

.test-intro {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 40px;
  max-width: 640px;
}

.test-intro h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 30px;
  margin: 0 0 6px;
}

.test-intro .subtitle {
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--coral);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin: 0 0 24px;
}

.test-stats {
  display: flex;
  gap: 28px;
  margin: 28px 0 32px;
  padding: 20px 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.test-stat-num {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 26px;
  color: var(--ink);
}

.test-stat-label {
  font-size: 12.5px;
  color: var(--slate);
  margin-top: 2px;
}

.test-intro p.rules {
  font-size: 14.5px;
  line-height: 1.65;
  color: var(--ink-soft);
}

/* Timer bar (sticky, exam feel) */
.exam-bar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--ink);
  color: var(--parchment);
  padding: 14px 24px;
  border-radius: 10px;
  margin-bottom: 28px;
  box-shadow: 0 4px 16px rgba(27,42,74,0.18);
}

.exam-bar-left {
  display: flex;
  align-items: center;
  gap: 14px;
}

.exam-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 16px;
}

.exam-progress-text {
  font-family: var(--font-mono);
  font-size: 12.5px;
  opacity: 0.7;
}

.exam-timer {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 19px;
  letter-spacing: 0.03em;
  padding: 6px 14px;
  border-radius: 6px;
  background: rgba(250,246,238,0.1);
}

.exam-timer.low {
  background: var(--coral);
  color: var(--white);
  animation: pulse-timer 1.2s infinite;
}

@keyframes pulse-timer {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.55; }
}

.q-list {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.q-card {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 26px 28px;
}

.q-card-head {
  display: flex;
  gap: 14px;
  margin-bottom: 16px;
}

.q-number {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 14px;
  color: var(--coral);
  flex-shrink: 0;
  padding-top: 2px;
}

.q-text {
  font-size: 16px;
  line-height: 1.5;
  font-weight: 500;
  color: var(--ink);
}

.q-options {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-left: 36px;
}

.q-option {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 14px;
  border: 1.5px solid var(--line);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14.5px;
  transition: border-color 0.15s ease, background 0.15s ease;
}

.q-option:hover {
  border-color: var(--ink-soft);
}

.q-option input[type="radio"] {
  accent-color: var(--coral);
  width: 16px;
  height: 16px;
  flex-shrink: 0;
}

.q-option.selected {
  border-color: var(--coral);
  background: rgba(224,83,61,0.06);
}

/* review state */
.q-option.correct-answer {
  border-color: var(--sage);
  background: rgba(122,155,118,0.12);
}
.q-option.wrong-selected {
  border-color: var(--coral);
  background: rgba(224,83,61,0.1);
}

.q-option-tag {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-weight: 700;
}
.q-option-tag.correct { color: var(--sage-deep); }
.q-option-tag.wrong { color: var(--coral-deep); }

.q-explain {
  margin-top: 14px;
  padding: 12px 14px;
  background: var(--parchment-deep);
  border-radius: 8px;
  font-size: 13.5px;
  line-height: 1.55;
  color: var(--ink-soft);
  padding-left: 36px;
  margin-left: 0;
}
.q-explain strong { color: var(--ink); }

.submit-bar {
  margin-top: 32px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 20px 28px;
}

.submit-bar-text {
  font-size: 13.5px;
  color: var(--slate);
}

.submit-bar-text strong { color: var(--ink); }

/* Results */
.results-summary {
  background: var(--ink);
  color: var(--parchment);
  border-radius: 14px;
  padding: 40px;
  margin-bottom: 32px;
  display: flex;
  align-items: center;
  gap: 36px;
}

.score-ring {
  position: relative;
  width: 120px;
  height: 120px;
  flex-shrink: 0;
}

.score-ring svg { transform: rotate(-90deg); }

.score-ring-text {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

.score-ring-num {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 28px;
}

.score-ring-denom {
  font-family: var(--font-mono);
  font-size: 12px;
  opacity: 0.65;
}

.results-summary-text h2 {
  font-family: var(--font-display);
  font-size: 24px;
  margin: 0 0 8px;
}

.results-summary-text p {
  margin: 0;
  opacity: 0.8;
  font-size: 14.5px;
  line-height: 1.55;
}

.results-meta {
  display: flex;
  gap: 28px;
  margin-top: 18px;
}

.results-meta-item {
  font-family: var(--font-mono);
  font-size: 13px;
}
.results-meta-item span { opacity: 0.6; display: block; font-size: 11px; margin-bottom: 2px;}

.review-label {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--coral);
  margin: 0 0 16px;
}
  </style>
</head>

  // Auth gate
  (function() {
    try {
      const s = JSON.parse(localStorage.getItem('hippo_session') || 'null');
      if (!s || !s.email) { window.location.href = 'register.html'; return; }
      const users = JSON.parse(localStorage.getItem('hippo_users') || '{}');
      const user = users[s.email];
      if (!user || !user.unlocked) { window.location.href = 'register.html'; return; }
    } catch(e) { window.location.href = 'register.html'; return; }
  })();

// HIPPO PREP — app.js
// Single-page app: home (book picker) -> crossword | test1 | test2
// ============================================================

const root = document.getElementById('app');

let state = {
  route: 'home',           // home | crossword-picker | crossword | fs1-picker | fs1-intro | fs1-exam | fs1-results | test2-intro | ...
  currentPuzzleKey: null,  // which crossword puzzle is active
  currentTestKey: null,    // which FS1 test is active
  testAnswers: {},         // questionIndex -> selectedOptionIndex
  testTimeLeft: 0,
  testTimerId: null,
  testStartedAt: null,
  testElapsedAtSubmit: null,
};

function navigate(route) {
  if (state.testTimerId) {
    clearInterval(state.testTimerId);
    state.testTimerId = null;
  }
  state.route = route;
  render();
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
}

function render() {
  switch (state.route) {
    case 'home': return renderHome();
    case 'crossword-picker': return renderCrosswordPicker();
    case 'crossword': return renderCrossword(state.currentPuzzleKey);
    case 'fs1-picker': return renderFs1Picker();
    case 'fs1-intro': return renderTestIntro(FS1_TESTS[state.currentTestKey], state.currentTestKey);
    case 'fs1-exam': return renderTestExam(FS1_TESTS[state.currentTestKey], state.currentTestKey);
    case 'fs1-results': return renderTestResults(FS1_TESTS[state.currentTestKey], state.currentTestKey);
    case 'fs2-picker': return renderFs2Picker();
    case 'fs2-intro': return renderTestIntro(FS2_TESTS[state.currentTestKey], state.currentTestKey);
    case 'fs2-exam': return renderTestExam(FS2_TESTS[state.currentTestKey], state.currentTestKey);
    case 'fs2-results': return renderTestResults(FS2_TESTS[state.currentTestKey], state.currentTestKey);
    default: return renderHome();
  }
}

function topbar(showBack) {
  const s = (() => { try { return JSON.parse(localStorage.getItem('hippo_session')||'null'); } catch { return null; } })();
  const email = s ? s.email : '';
  return `
    <div class="topbar">
      <div class="brand">
        <span class="brand-mark">Hippo Prep</span>
        <span class="brand-tag">Olympiad Study Shelf</span>
      </div>
      <div style="display:flex;align-items:center;gap:12px;">
        ${showBack ? `<button class="back-link" id="btn-home">&larr; All resources</button>` : ''}
        ${email ? `<span style="font-size:12px;color:var(--slate);font-family:var(--font-mono)">${email}</span>` : ''}
        <button onclick="localStorage.removeItem('hippo_session');window.location.href='register.html'" style="font-size:12px;background:none;border:1.5px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;color:var(--slate);font-family:var(--font-body);">Гарах</button>
      </div>
    </div>
  `;
}

const LEVEL_ORDER = ['Below Scale', 'CEFR A1', 'CEFR A2', 'CEFR B1', 'CEFR B2', 'CEFR C1'];
const LEVEL_TONES = {
  'Below Scale': 'sage', 'CEFR A1': 'coral', 'CEFR A2': 'ink-soft',
  'CEFR B1': 'sage', 'CEFR B2': 'coral', 'CEFR C1': 'ink-soft'
};

function groupPuzzlesByLevel() {
  const groups = {};
  LEVEL_ORDER.forEach(l => groups[l] = []);
  Object.keys(CROSSWORD_PUZZLES).forEach(key => {
    const p = CROSSWORD_PUZZLES[key];
    if (!groups[p.level]) groups[p.level] = [];
    groups[p.level].push({ key, ...p });
  });
  Object.values(groups).forEach(arr => arr.sort((a, b) => a.title.localeCompare(b.title)));
  return groups;
}

let activeLevelTab = 'Below Scale';

function renderCrosswordPicker() {
  const groups = groupPuzzlesByLevel();
  const totalCount = Object.keys(CROSSWORD_PUZZLES).length;

  root.innerHTML = `
    <div class="app">
      ${topbar(true)}
      <div class="page-head">
        <p class="page-eyebrow">Resource 01 &middot; Crossword</p>
        <h1>Choose a puzzle</h1>
        <p>${totalCount} crosswords adapted from <em>Guess and Learn Crosswords</em> (Hippo SRL), covering every level from Below Scale through C1. Same words and clues as the book, redrawn as interactive grids.</p>
      </div>

      <div class="level-tabs" id="level-tabs">
        ${LEVEL_ORDER.map(level => `
          <button class="level-tab ${level === activeLevelTab ? 'active' : ''}" data-level="${level}">
            ${level} <span class="level-tab-count">${groups[level].length}</span>
          </button>
        `).join('')}
      </div>

      <div class="shelf" id="puzzle-grid" style="grid-template-columns: repeat(3, 1fr); margin-top:20px;">
        ${groups[activeLevelTab].map(p => {
          const tone = LEVEL_TONES[p.level] || 'coral';
          return `
            <button class="book" data-tone="${tone}" data-key="${p.key}" style="min-height:180px;">
              <span class="book-spine"></span>
              <span class="book-body">
                <span class="book-kicker">${p.level}</span>
                <span class="book-title" style="font-size:21px;">${p.title}</span>
                <span class="book-meta" style="border-top:none; padding-top:0; margin-top:auto;">
                  <span class="book-meta-stat">${p.words.length} words</span>
                  <span class="book-cta">Solve ${arrowIcon()}</span>
                </span>
              </span>
            </button>`;
        }).join('')}
      </div>
    </div>
  `;
  document.getElementById('btn-home').onclick = () => navigate('home');

  root.querySelectorAll('.level-tab').forEach(tab => {
    tab.onclick = () => {
      activeLevelTab = tab.dataset.level;
      renderCrosswordPicker();
    };
  });

  wirePuzzlePickerCards();
}

function wirePuzzlePickerCards() {
  root.querySelectorAll('.book[data-key]').forEach(btn => {
    btn.onclick = () => {
      state.currentPuzzleKey = btn.dataset.key;
      navigate('crossword');
    };
  });
}

const FS1_LEVEL_ORDER = ['Baby Hippo', 'Little Hippo', 'Hippo 1', 'Hippo 2-S1'];
const FS1_LEVEL_TONES = {
  'Baby Hippo': 'sage', 'Little Hippo': 'coral', 'Hippo 1': 'ink-soft', 'Hippo 2-S1': 'sage'
};
const FS1_TYPE_ORDER = ['Test of English MC', 'National Finals', 'Test of English Use', 'Writing'];

let fs1ActiveLevelTab = 'Baby Hippo';

function groupFs1ByLevel() {
  const groups = {};
  FS1_LEVEL_ORDER.forEach(l => groups[l] = []);
  Object.keys(FS1_TESTS).forEach(key => {
    const t = FS1_TESTS[key];
    if (!groups[t.level]) groups[t.level] = [];
    groups[t.level].push({ key, ...t });
  });
  Object.values(groups).forEach(arr => arr.sort((a, b) => {
    const ai = FS1_TYPE_ORDER.indexOf(a.testType), bi = FS1_TYPE_ORDER.indexOf(b.testType);
    if (ai !== bi) return ai - bi;
    return a.title.localeCompare(b.title);
  }));
  return groups;
}

function renderFs1Picker() {
  const groups = groupFs1ByLevel();

function renderCrossword(puzzleKey) {
  const puzzle = CROSSWORD_PUZZLES[puzzleKey];
  const { rows, cols, words, title, level } = puzzle;

  // Build grid map: r,c -> {letter, numbers: [{num, dir, wordIdx}]}
  const cellMap = {};
  words.forEach((w, wi) => {
    for (let i = 0; i < w.word.length; i++) {
      const r = w.direction === 'down' ? w.row + i : w.row;
      const c = w.direction === 'across' ? w.col + i : w.col;
      const key = `${r}-${c}`;
      if (!cellMap[key]) cellMap[key] = { letter: w.word[i], starts: [] };
      if (i === 0) cellMap[key].starts.push(w.number);
    }
  });

  let gridHTML = '';
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const key = `${r}-${c}`;
      if (cellMap[key]) {
        const startNum = cellMap[key].starts.length ? cellMap[key].starts[0] : '';
        gridHTML += `
          <div class="cell active" data-row="${r}" data-col="${c}">
            ${startNum ? `<span class="cell-number">${startNum}</span>` : ''}
            <input type="text" maxlength="1" data-row="${r}" data-col="${c}" data-answer="${cellMap[key].letter}" autocomplete="off" spellcheck="false" aria-label="Crossword cell row ${r+1} column ${c+1}" />
          </div>`;
      } else {
        gridHTML += `<div class="cell empty"></div>`;
      }
    }
  }

  const acrossWords = words.filter(w => w.direction === 'across').sort((a,b) => a.number - b.number);
  const downWords = words.filter(w => w.direction === 'down').sort((a,b) => a.number - b.number);

  function clueLi(w) {
    const lengthLabel = w.display.includes(' ')
      ? w.display.split(' ').map(part => part.length).join(', ')
      : String(w.word.length);
    return `<li data-number="${w.number}" data-direction="${w.direction}"><span class="clue-num">${w.number}.</span><span>${w.clue} <em style="opacity:.55">(${lengthLabel})</em></span></li>`;
  }

  root.innerHTML = `
    <div class="app">
      ${topbar(true)}
      <div class="page-head">
        <p class="page-eyebrow">Resource 01 &middot; ${level}</p>
        <h1>${title}</h1>
        <p>Click a clue or a cell to jump to it. Type a letter and the cursor moves forward automatically. Check your work any time &mdash; correct letters turn green.</p>
      </div>

      <div class="xword-layout">
        <div class="xword-board-wrap">
          <div class="xword-grid" id="xword-grid" style="grid-template-columns: repeat(${cols}, 34px); grid-template-rows: repeat(${rows}, 34px);">
            ${gridHTML}
          </div>
        </div>

        <div class="xword-side">
          <div class="xword-progress">
            <div class="xword-progress-label"><span>Letters filled</span><span id="xword-progress-count">0 / ${Object.keys(cellMap).length}</span></div>
            <div class="progress-track"><div class="progress-fill" id="xword-progress-fill" style="width:0%"></div></div>
          </div>

          <div class="xword-result-banner" id="xword-result-banner"></div>

          <div class="clue-panel">
            <h2>Across</h2>
            <ul class="clue-list" id="clues-across">${acrossWords.map(clueLi).join('')}</ul>
          </div>
          <div class="clue-panel">
            <h2>Down</h2>
            <ul class="clue-list" id="clues-down">${downWords.map(clueLi).join('')}</ul>
          </div>

          <div class="xword-controls">
            <button class="btn btn-primary" id="xword-check">Check answers</button>
            <button class="btn btn-secondary" id="xword-reveal">Reveal solution</button>
            <button class="btn btn-secondary" id="xword-clear">Clear grid</button>
            <button class="btn btn-secondary" id="xword-other">Choose another puzzle</button>
          </div>
        </div>
      </div>
    </div>
  `;

  document.getElementById('btn-home').onclick = () => navigate('home');
  document.getElementById('xword-other').onclick = () => navigate('crossword-picker');

  // wire cell inputs
  xwordCellRefs = {};
  const inputs = root.querySelectorAll('.cell input');
  inputs.forEach(inp => {
    const r = inp.dataset.row, c = inp.dataset.col;
    xwordCellRefs[`${r}-${c}`] = inp;
    inp.addEventListener('input', (e) => {
      inp.value = inp.value.toUpperCase().replace(/[^A-Z]/g, '');
      updateXwordProgress(cellMap);
      if (inp.value) moveToNextCell(r, c, words);
    });
    inp.addEventListener('keydown', (e) => handleXwordKeydown(e, r, c, words));
    inp.addEventListener('focus', () => highlightWordAt(r, c, words));
  });

  // wire clue clicks
  root.querySelectorAll('.clue-list li').forEach(li => {
    li.onclick = () => {
      const num = parseInt(li.dataset.number, 10);
      const dir = li.dataset.direction;
      const w = words.find(w => w.number === num && w.direction === dir);
      if (w) {
        xwordCurrentDirection = dir;
        const key = `${w.row}-${w.col}`;
        xwordCellRefs[key]?.focus();
        highlightWordAt(w.row, w.col, words, dir);
      }
    };
  });

  document.getElementById('xword-check').onclick = () => checkXword(words, cellMap);
  document.getElementById('xword-reveal').onclick = () => revealXword(cellMap);
  document.getElementById('xword-clear').onclick = () => clearXword(cellMap);

  updateXwordProgress(cellMap);
}

function highlightWordAt(r, c, words, preferDir) {
  root.querySelectorAll('.cell.highlight').forEach(el => el.classList.remove('highlight'));
  r = parseInt(r, 10); c = parseInt(c, 10);
  const candidates = words.filter(w => {
    if (w.direction === 'across') return w.row === r && c >= w.col && c < w.col + w.word.length;
    return w.col === c && r >= w.row && r < w.row + w.word.length;
  });
  let w = candidates.find(cd => cd.direction === preferDir) || candidates.find(cd => cd.direction === xwordCurrentDirection) || candidates[0];
  if (!w) return;
  xwordCurrentDirection = w.direction;
  for (let i = 0; i < w.word.length; i++) {
    const rr = w.direction === 'down' ? w.row + i : w.row;
    const cc = w.direction === 'across' ? w.col + i : w.col;
    const cell = root.querySelector(`.cell[data-row="${rr}"][data-col="${cc}"]`);
    if (cell) cell.classList.add('highlight');
  }
}

function moveToNextCell(r, c, words) {
  r = parseInt(r, 10); c = parseInt(c, 10);
  const nr = xwordCurrentDirection === 'down' ? r + 1 : r;
  const nc = xwordCurrentDirection === 'across' ? c + 1 : c;
  const next = xwordCellRefs[`${nr}-${nc}`];
  if (next) next.focus();
}

function handleXwordKeydown(e, r, c, words) {
  r = parseInt(r, 10); c = parseInt(c, 10);
  const dirs = { ArrowRight: [0,1], ArrowLeft: [0,-1], ArrowUp: [-1,0], ArrowDown: [1,0] };
  if (dirs[e.key]) {
    e.preventDefault();
    const [dr, dc] = dirs[e.key];
    const next = xwordCellRefs[`${r+dr}-${c+dc}`];
    if (next) {
      if (dr !== 0) xwordCurrentDirection = 'down';
      if (dc !== 0) xwordCurrentDirection = 'across';
      next.focus();
    }
  } else if (e.key === 'Backspace' && !e.target.value) {
    const pr = xwordCurrentDirection === 'down' ? r - 1 : r;
    const pc = xwordCurrentDirection === 'across' ? c - 1 : c;
    const prev = xwordCellRefs[`${pr}-${pc}`];
    if (prev) prev.focus();
  }
}

function updateXwordProgress(cellMap) {
  const total = Object.keys(cellMap).length;
  let filled = 0;
  Object.keys(xwordCellRefs).forEach(key => { if (xwordCellRefs[key].value) filled++; });
  const pct = total ? Math.round((filled/total)*100) : 0;
  const countEl = document.getElementById('xword-progress-count');
  const fillEl = document.getElementById('xword-progress-fill');
  if (countEl) countEl.textContent = `${filled} / ${total}`;
  if (fillEl) fillEl.style.width = `${pct}%`;
}

function checkXword(words, cellMap) {
  let correct = 0, total = 0, allFilled = true;
  Object.keys(cellMap).forEach(key => {
    total++;
    const inp = xwordCellRefs[key];
    const cell = inp.closest('.cell');
    if (!inp.value) allFilled = false;
    if (inp.value === cellMap[key].letter) {
      correct++;
      cell.classList.add('filled-correct');
      inp.style.color = 'var(--sage-deep)';
    } else {
      cell.classList.remove('filled-correct');
      inp.style.color = inp.value ? 'var(--coral-deep)' : 'var(--ink)';
    }
  });

  // mark solved clues
  words.forEach(w => {
    let solved = true;
    for (let i = 0; i < w.word.length; i++) {
      const r = w.direction === 'down' ? w.row + i : w.row;
      const c = w.direction === 'across' ? w.col + i : w.col;
      const inp = xwordCellRefs[`${r}-${c}`];
      if (!inp || inp.value !== w.word[i]) { solved = false; break; }
    }
    const li = root.querySelector(`.clue-list li[data-number="${w.number}"][data-direction="${w.direction}"]`);
    if (li) li.classList.toggle('solved', solved);
  });

  const banner = document.getElementById('xword-result-banner');
  banner.classList.add('show');
  if (correct === total) {
    banner.style.background = 'var(--sage)';
    banner.textContent = `Solved! All ${total} letters correct.`;
  } else {
    banner.style.background = 'var(--coral)';
    banner.textContent = `${correct} / ${total} letters correct${allFilled ? '' : ' \u2014 some cells are still empty'}.`;
  }
}

function revealXword(cellMap) {
  Object.keys(cellMap).forEach(key => {
    const inp = xwordCellRefs[key];
    inp.value = cellMap[key].letter;
    inp.style.color = 'var(--sage-deep)';
    inp.closest('.cell').classList.add('filled-correct');
  });
  root.querySelectorAll('.clue-list li').forEach(li => li.classList.add('solved'));
  updateXwordProgress(cellMap);
  const banner = document.getElementById('xword-result-banner');
  banner.classList.add('show');
  banner.style.background = 'var(--ink-soft)';
  banner.textContent = 'Solution revealed.';
}

function clearXword(cellMap) {
  Object.keys(cellMap).forEach(key => {
    const inp = xwordCellRefs[key];
    inp.value = '';
    inp.style.color = 'var(--ink)';
    inp.closest('.cell').classList.remove('filled-correct');
  });
  root.querySelectorAll('.clue-list li').forEach(li => li.classList.remove('solved'));
  const banner = document.getElementById('xword-result-banner');
  banner.classList.remove('show');
  updateXwordProgress(cellMap);
}

function renderTestExam(test, key) {
  const answeredCount = Object.keys(state.testAnswers).length;
  const isFs1 = key in (typeof FS1_TESTS !== 'undefined' ? FS1_TESTS : {});
  const isFs2 = key in (typeof FS2_TESTS !== 'undefined' ? FS2_TESTS : {});
  const backRoute = isFs1 ? 'fs1-picker' : isFs2 ? 'fs2-picker' : 'home';
  const resultsRoute = isFs1 ? 'fs1-results' : isFs2 ? 'fs2-results' : `${key}-results`;

  root.innerHTML = `
    <div class="app">
      ${topbar(true)}
      <div class="exam-bar">
        <div class="exam-bar-left">
          <span class="exam-title">${test.title}</span>
          <span class="exam-progress-text" id="exam-progress-text">${answeredCount} / ${test.questions.length} answered</span>
        </div>
        <div class="exam-timer" id="exam-timer">--:--</div>
      </div>

      <div class="q-list" id="q-list">
        ${test.questions.map((q, qi) => questionCardHTML(q, qi, false)).join('')}
      </div>

      <div class="submit-bar">
        <div class="submit-bar-text"><strong id="submit-answered-count">${answeredCount}</strong> of ${test.questions.length} answered</div>
        <button class="btn btn-primary" id="submit-test">Submit test</button>
      </div>
    </div>
  `;

  document.getElementById('btn-home').onclick = () => {
    if (confirm('Leave this test? Your progress will be lost.')) navigate(backRoute);
  };

  // wire option clicks
  test.questions.forEach((q, qi) => {
    root.querySelectorAll(`.q-card[data-qi="${qi}"] .q-option`).forEach((opt, oi) => {
      opt.onclick = () => {
        state.testAnswers[qi] = oi;
        root.querySelectorAll(`.q-card[data-qi="${qi}"] .q-option`).forEach(o => o.classList.remove('selected'));
        opt.classList.add('selected');
        opt.querySelector('input').checked = true;
        updateAnsweredCount(test);
      };
    });
  });

  document.getElementById('submit-test').onclick = () => {
    const unanswered = test.questions.length - Object.keys(state.testAnswers).length;
    const proceed = unanswered === 0 || confirm(`You have ${unanswered} unanswered question${unanswered === 1 ? '' : 's'}. Submit anyway?`);
    if (proceed) {
      state.testElapsedAtSubmit = test.durationMinutes * 60 - state.testTimeLeft;
      navigate(resultsRoute);
    }
  };

  startExamTimer(test, key, resultsRoute);
}

function questionCardHTML(q, qi, reviewMode) {
  const selected = state.testAnswers[qi];
  return `
    <div class="q-card" data-qi="${qi}">
      <div class="q-card-head">
        <span class="q-number">Q${qi + 1}</span>
        <span class="q-text">${q.q}</span>
      </div>
      <div class="q-options">
        ${q.options.map((opt, oi) => {
          let cls = 'q-option';
          let tag = '';
          if (reviewMode) {
            if (oi === q.answer) { cls += ' correct-answer'; tag = '<span class="q-option-tag correct">Correct</span>'; }
            else if (oi === selected) { cls += ' wrong-selected'; tag = '<span class="q-option-tag wrong">Your answer</span>'; }
          } else if (selected === oi) {
            cls += ' selected';
          }
          return `
            <label class="${cls}">
              <input type="radio" name="q${qi}" value="${oi}" ${selected === oi ? 'checked' : ''} ${reviewMode ? 'disabled' : ''} />
              <span>${opt}</span>
              ${tag}
            </label>`;
        }).join('')}
      </div>
      ${reviewMode && q.explain ? `<div class="q-explain"><strong>Why:</strong> ${q.explain}</div>` : ''}
    </div>
  `;
}

function updateAnsweredCount(test) {
  const n = Object.keys(state.testAnswers).length;
  const pEl = document.getElementById('exam-progress-text');
  const sEl = document.getElementById('submit-answered-count');
  if (pEl) pEl.textContent = `${n} / ${test.questions.length} answered`;
  if (sEl) sEl.textContent = n;
}

function startExamTimer(test, key, resultsRoute) {
  const timerEl = document.getElementById('exam-timer');
  function tick() {
    const mins = Math.floor(state.testTimeLeft / 60);
    const secs = state.testTimeLeft % 60;
    timerEl.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
    timerEl.classList.toggle('low', state.testTimeLeft <= 60);
    if (state.testTimeLeft <= 0) {
      clearInterval(state.testTimerId);
      state.testTimerId = null;
      state.testElapsedAtSubmit = test.durationMinutes * 60;
      navigate(resultsRoute);
      return;
    }
    state.testTimeLeft--;
  }
  tick();
  state.testTimerId = setInterval(tick, 1000);
}

// ============================================================
// TEST RESULTS
// ============================================================

function renderTestResults(test, key) {
  let correct = 0;
  test.questions.forEach((q, qi) => { if (state.testAnswers[qi] === q.answer) correct++; });
  const total = test.questions.length;
  const pct = Math.round((correct / total) * 100);
  const elapsed = state.testElapsedAtSubmit ?? 0;
  const mins = Math.floor(elapsed / 60), secs = elapsed % 60;

  const isFs1 = key in (typeof FS1_TESTS !== 'undefined' ? FS1_TESTS : {});
  const isFs2 = key in (typeof FS2_TESTS !== 'undefined' ? FS2_TESTS : {});
  const eyebrow = isFs1
    ? `Resource 02 &middot; ${test.level} &middot; Results`
    : isFs2
      ? `Resource 03 &middot; ${test.level} &middot; Results`
      : (key === 'test1' ? 'Resource 02 &middot; Results' : 'Resource 03 &middot; Results');
  const shelfRoute = isFs1 ? 'fs1-picker' : isFs2 ? 'fs2-picker' : 'home';
  const retakeRoute = isFs1 ? 'fs1-intro' : isFs2 ? 'fs2-intro' : `${key}-intro`;
  const explainNote = test.questions.some(q => q.explain)
    ? ' with an explanation for every question'
    : '';

  const circumference = 2 * Math.PI * 50;
  const dashOffset = circumference * (1 - pct / 100);

  let band = 'Keep practicing';
  if (pct >= 85) band = 'Excellent work';
  else if (pct >= 70) band = 'Solid result';
  else if (pct >= 50) band = 'Good progress';

  root.innerHTML = `
    <div class="app">
      ${topbar(true)}
      <div class="page-head">
        <p class="page-eyebrow">${eyebrow}</p>
        <h1>${test.title} &mdash; Score Report</h1>
      </div>

      <div class="results-summary">
        <div class="score-ring">
          <svg width="120" height="120" viewBox="0 0 120 120">
            <circle cx="60" cy="60" r="50" fill="none" stroke="rgba(250,246,238,0.15)" stroke-width="10" />
            <circle cx="60" cy="60" r="50" fill="none" stroke="#7A9B76" stroke-width="10"
              stroke-dasharray="${circumference}" stroke-dashoffset="${dashOffset}" stroke-linecap="round" />
          </svg>
          <div class="score-ring-text">
            <span class="score-ring-num">${pct}%</span>
            <span class="score-ring-denom">${correct} / ${total}</span>
          </div>
        </div>
        <div class="results-summary-text">
          <h2>${band}</h2>
          <p>You answered ${correct} out of ${total} questions correctly. Review the answer key below to see exactly where points were gained or lost${explainNote}.</p>
          <div class="results-meta">
            <div class="results-meta-item"><span>Time used</span>${mins}:${secs.toString().padStart(2,'0')} of ${test.durationMinutes}:00</div>
            <div class="results-meta-item"><span>Unanswered</span>${total - Object.keys(state.testAnswers).length}</div>
          </div>
        </div>
      </div>

      <p class="review-label">Answer key &amp; review</p>
      <div class="q-list">
        ${test.questions.map((q, qi) => questionCardHTML(q, qi, true)).join('')}
      </div>

      <div class="submit-bar" style="margin-top:24px; justify-content: center; gap: 14px;">
        <button class="btn btn-secondary" id="retake-test">Retake this test</button>
        <button class="btn btn-primary" id="back-to-shelf">Back to all resources</button>
      </div>
    </div>
  `;

  document.getElementById('btn-home').onclick = () => navigate(shelfRoute);
  document.getElementById('back-to-shelf').onclick = () => navigate(shelfRoute);
  document.getElementById('retake-test').onclick = () => navigate(retakeRoute);
}

// ============================================================
// INIT
// ============================================================

render();
  </script>
</body>
</html>
